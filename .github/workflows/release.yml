name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers the workflow when you push a tag like v1.0, v2.1, etc.

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # This permission is required to create a GitHub Release

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Highly stable version for compiling Windows executables

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --add-data "assets;assets" snake.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/snake.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
